const rankingSources={
  wb:'Világbank WDI · beépített kiadás',

const aggregateCodes=new Set(['EUU','OED','WLD']);
function rankingSource(row){
  if(row.m==='nra'&&row.src==='oecd'+row.y)return 'oecd';
  if(row.src==='hly'&&row.y<2015)return 'kshLegacy';
  return row.src;
}
function inequality(){
  const {rank:metric,s:rankSex}=state;
  const eligible=db.filter(row=>row.m===metric&&row.s===rankSex&&!row.imported&&
    !aggregateCodes.has(row.c)&&Object.hasOwn(rankingSources,rankingSource(row)));
  const sources=Object.fromEntries(Object.entries(rankingSources).filter(([key])=>
    eligible.some(row=>rankingSource(row)===key)));
  const currentSource=Object.hasOwn(sources,state.rankSource)?state.rankSource:Object.keys(sources)[0];
  const sameSource=eligible.filter(row=>rankingSource(row)===currentSource);
  const years=[...new Set(sameSource.map(row=>row.y))].sort((a,b)=>b-a);
  const year=years.includes(state.rankYear)?state.rankYear:years[0];
  const rows=sameSource.filter(row=>row.y===year).sort((a,b)=>b.v-a.v||names[a.c].localeCompare(names[b.c],'hu'));
  const max=Math.max(1,...rows.map(row=>row.v));
  const controls=control('Mutató',sel('rank',metrics,metric))+control('Nem',sex())+
    (currentSource?control('Forrás és módszertan',sel('rankSource',sources,currentSource))+
      control('Referenciaév',sel('rankYear',Object.fromEntries(years.map(y=>[y,y])),year)):'');
  const results=rows.length<2?'<p>Ebben a bontásban nincs legalább két összehasonlítható ország.</p>':
    rows.map(row=>`<div class="barrow" data-rank-country="${row.c}" data-year="${row.y}" data-source="${currentSource}"><span>${names[row.c]}</span><div class="bartrack"><span style="background:${color(row.c)};width:${row.v/max*100}%"></span></div><b>${fmt(row.v)}</b></div>`).join('');
  const missing=Object.entries(names).filter(([code])=>!aggregateCodes.has(code)&&!rows.some(row=>row.c===code)).map(([,name])=>name);
  return title('07 / Egyenlőtlenségek','A hosszú élet földrajza','Az országok összehasonlítása azonos mutató, nem, referenciaév és forrásmódszertan alapján.')+
    `<div class="panel"><div class="controls">${controls}</div><h2>Országrangsor${year?' · '+year:''}</h2><div id="ranking">${results}</div>${note(
      'A területi összesítések és az ellenőrizetlen saját CSV-adatok nem szerepelnek a rangsorban.'+
      (missing.length&&year?' Adat nélkül ebben a bontásban: '+missing.join(', ')+'.':''))}</div>`;
}

function companion(){const snapshotValue=c=>db.find(r=>r.src==='wb'&&r.c===c&&r.m==='le'&&r.s==='T'&&r.y===2024)?.v;return title('09 / Kutatási kalauz','Kérdezzünk pontosabban','Forrásalapú, beépített értelmezési segédlet. Nem élő generatív AI.')+`<div class="panel"><div class="controls">${control('Vizsgált ország',sel('focus',names,state.focus))}</div>${[['Mit mond a születéskori élettartam?',`A kiválasztott ország (${names[state.focus]}) beépített WDI 2024-es értéke ${fmt(snapshotValue(state.focus))} év. Ez egy hipotetikus periódusmutató, nem az adott évben született gyermek tényleges várható élettartamának előrejelzése. ${link('wb','Adatforrás')}.`],['Miért rövidebb a magyar élettartam az osztráknál?',`A beépített WDI 2024-es értékei ${fmt(snapshotValue('HUN'))} és ${fmt(snapshotValue('AUT'))} év. A különbség értelmezéséhez a halálokok, az életkörülmények, a kockázati tényezők és az ellátáshoz való hozzáférés vizsgálata szükséges. Az OECD európai egészségjelentése a magyar magas kardiovaszkuláris halandóságot kiemeli. ${link('health','OECD/EU jelentés')} · ${link('wb','Világbank WDI')}.`],['Mi a HALE és a HLY különbsége?',`A WHO HALE a különböző egészségi állapotokat súlyozza. Az Eurostat HLY az aktivitáskorlátozottság nélküli éveket méri. Eltérő mérési konstrukciók, közvetlenül nem helyettesíthetők. ${link('hale','WHO/OWID HALE')} · ${link('health','Eurostat HLY')}.`],['A nők több egészséges évet nyernek?',`Az EU-ban 2024-ben 65 éves kortól a nők 21,8, a férfiak 18,4 további évre számíthattak. HLY: 10,5 és 10,0 év. A hosszabb össz-élettartam tehát nem feltétlenül jelent arányosan több korlátozottság nélküli időt. ${link('health','Forrás: 3.4. ábra')}.`],['Miért nem azonos a nyugdíj és a munkapiaci kilépés?',`A nyugdíjjogosultság intézményi szabály, a kilépés munkaerőpiaci statisztika. A nyugdíj mellett is lehet dolgozni, és a munkából a jogosultság előtt is ki lehet lépni. ${link('exit','OECD módszertan')}.`],['Mit jelent a társadalmi egyenlőtlenség?',`A foglalkozás, iskolázottság, jövedelem, gondozási terhek és lakóhely befolyásolhatják az életpályát. A nem fizetett gondozási munka és társadalmi részvétel külön indikátorokat kíván; országátlagból nem állapítható meg az egyéni helyzet. ${link('health','OECD/EU – egészségi egyenlőtlenségek')}.`],['Ellensúlyozhatja-e a termelékenység a népesség öregedését?',`Növelheti az egy dolgozóra jutó kibocsátást, de a nyugdíjak bérindexálása, az adóalap és a foglalkoztatási arány meghatározza a költségvetési következményeket. A Jövőlabor csak egyszerű azonosságot szemléltet.`]].map(([q,a])=>`<details class="question"><summary>${q}</summary><p>${a}</p></details>`).join('')}</div>`}

function dataPage(){return title('10 / Adatregiszter','Módszertan és adatlefedettség','A forrásverzió, az indikátor definíciója és az adathiány az eredmény része.')+`<div class="panel"><h2>Adatok frissítése és bővítése</h2><p>Az alkalmazás beépített adatokat tartalmaz, és internetkapcsolat esetén közvetlenül megpróbálja betölteni a nyilvános adatforrásokat. Az API-k és a böngésző hozzáférési szabályai változhatnak. Sikertelen betöltés nem módosítja a meglévő adatokat.</p><div class="controls"><button class="primary" id="wbLoad" ${dataStatus.loading?'disabled':''}>Világbank idősorok (1960–)</button><button id="unLoad" ${dataStatus.loading?'disabled':''}>ENSZ / OWID élettartam (1950–)</button><button id="projLoad" ${dataStatus.loading?'disabled':''}>ENSZ projekció (2024–2100)</button><button id="haleLoad" ${dataStatus.loading?'disabled':''}>WHO HALE (OWID)</button></div><div id="loadStatus" class="status" aria-live="polite">${esc(dataStatus.load)}</div><p class="muted">A külső adatok csak az aktuális munkamenetben maradnak meg. A teljes adatállomány CSV-ben exportálható.</p><button id="exportAll">Minden betöltött adat exportálása</button><h3>Saját adatok importálása</h3><p class="muted">CSV oszlopai: c,m,s,y,v,src,kind. ISO3 országkód, mutatókód, T/M/F nem, év, szám, forrás HTTPS URL, adatállapot. A meglevő rekordok nem íródnak felül. Új országkód importálható. A születéskori élettartam megjelenítéséhez válaszd a Saját CSV forrást az Idővonalon.</p><input type="file" accept=".csv,text/csv" id="importFile"><div id="importStatus" class="status" aria-live="polite">${esc(dataStatus.import)}</div><details><summary>Mutatókódok</summary><p>${Object.entries(metrics).map(([k,v])=>`<code>${k}</code> = ${v}`).join(' · ')}</p></details></div><div class="panel"><h2>Forrásregiszter</h2><div class="tablewrap"><table><thead><tr><th>Adat / forrás</th><th>Referenciaidő</th><th>Mérték</th><th>Korlát / verzió</th></tr></thead><tbody><tr><td>${link('wb','Világbank WDI (beépített)')}</td>< lapotot és forrás-URL-t tartalmazza. A bázisévhez viszonyított eltérés csak a grafikonon jelenik meg. A források eredeti revíziós jelzései nem minden rekordra érhetők el.')}</div>`}
const dataStatus={loading:false,load:'',import:''};
const fields=['c','m','s','y','v','src','kind'];
function parseCSV(text){
  // Accept quoted commas, doubled quotes and line breaks, but reject unbalanced or misplaced quotes.
  const rows=[];
  let row=[], value='', quoted=false, closed=false;
  const field=()=>{row.push(value);value='';closed=false};
  const record=()=>{field();if(row.some(Boolean))rows.push(row);row=[]};
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(quoted){
      if(ch==='"'&&text[i+1]==='"'){value+='"';i++}
      else if(ch==='"'){quoted=false;closed=true}
      else value+=ch;
    }else if(ch===',')field();
    else if(ch==='\r'||ch==='\n'){
      if(ch==='\r'&&text[i+1]==='\n')i++;
      record();
    }else if(ch==='"'&&!value&&!closed)quoted=true;
    else if(closed||ch==='"')throw Error('Hibás CSV-idézőjelezés.');
    else value+=ch;
  }
  if(quoted)throw Error('Lezáratlan CSV-idézőjel.');
  if(row.length||value||closed)record();
  return rows;
}
function recordSource(row){
  if(row.imported)return row.src;
  const code=wbCodes[row.m]?.[row.s];
  if(row.src==='wb'||row.src==='wb-live')return 'https://data.worldbank.org/indicator/'+code;
  return source[row.src];
}
function downloadCSV(rows){
  const quote=value=>'"'+String(value).replaceAll('"','""')+'"';
  const safeText=value=>/^[\s\u0000-\u001f]*[=+\-@＝＋－＠]|^[\t\r\n]/u.test(value)?"'"+value:value;
  const lines=rows.map(r=>[r.c,r.m,r.s,r.y,r.v,recordSource(r),safeText(r.kind)].map(quote).join(','));
  const url=URL.createObjectURL(new Blob(['\ufeff'+fields.join(',')+'\n'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');
  a.href=url;
  a.download='human-lifespan-adatok.csv';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function fetchData(url){
  const response=await fetch(url,{signal:AbortSignal.timeout(15000)});
  if(!response.ok)throw Error('HTTP '+response.status);
  return response;
}
function recordKey(r){return [r.c,r.m,r.s,r.y,r.src].join('|')}
async function loadOnline(label,read){
  if(dataStatus.loading)return;
  dataStatus.loading=true;
  dataStatus.load=label+'…';
  let changed=false;
  render();
  try{
    const rows=await read();
    if(!rows.length)throw Error('Nem található érvényes rekord');
    const existing=new Set(db.map(recordKey));
    let added=0;
    for(const row of rows){
      const key=recordKey(row);
      if(existing.has(key))continue;
      db.push(row);
      existing.add(key);
      added++;
    }
    changed=added>0;
    dataStatus.load=added+' új rekord. Betöltés befejezve.';
  }catch(error){
    const reason=error.name==='TimeoutError'?'a lekérés túllépte az időkorlátot':error instanceof TypeError?'hálózati vagy böngésző-hozzáférési hiba':error.message;
    dataStatus.load='Nem sikerült betölteni ('+reason+'). A beépített adatok továbbra is használhatók.';
  }finally{
    dataStatus.loading=false;
    if(state.tab===9||changed&&state.tab===0)render();
  }
}
function wbLoad(){
  return loadOnline('Világbank lekérdezése',async()=>{
    const requests=Object.entries(wbCodes).flatMap(([m,sexes])=>Object.entries(sexes).map(async([s,code])=>{
      const url='https://api.worldbank.org/v2/country/'+Object.keys(lifeSnapshot.T).join(';')+'/indicator/'+code+'?format=json&date=1960:2026&per_page=20000';
      const [meta,records]=await (await fetchData(url)).json();
      if(meta?.pages!==1||!Array.isArray(records))throw Error('Ismeretlen Világbank-séma');
      return records.flatMap(r=>{
        const c=r.countryiso3code, y=Number(r.date), v=r.value;
        if(!Object.hasOwn(lifeSnapshot.T,c)||r.indicator?.id!==code||!validYear(y)||!validValue(m,v))return [];
        return [{c,m,s,y,v,src:'wb-live',kind:'WDI közölt / becsült'}];
      });
    }));
    return (await Promise.all(requests)).flat();
  });
}
const owidColumns={
  hist:'Life expectancy at birth',
  proj:'Life expectancy at birth (Projected)',
  hale:'Healthy life expectancy (HALE) at birth (years) - Sex: both sexes'
};
async function owLoad(key){
  return loadOnline('Lekérés',async()=>{
    const {m,slug}=owid[key];
    const records=parseCSV((await (await fetchData('https://ourworldindata.org/grapher/'+slug+'.csv?csvType=full')).text()).replace(/^\ufeff/,''));
    const headers=records.shift()??[];
    const [ci,yi,vi]=['Code','Year',owidColumns[key]].map(h=>headers.indexOf(h));
    if([ci,yi,vi].includes(-1))throw Error('Ismeretlen OWID-séma');
    const regions={OWID_WRL:'WLD',OWID_EU27:'EUU',OWID_OECD:'OED'};
    return records.flatMap(row=>{
      const code=row[ci],c=Object.hasOwn(regions,code)?regions[code]:code;
      const y=Number(row[yi]),v=readNumber(row[vi]);
      if(row.length!==headers.length||!Object.hasOwn(names,c)||!validYear(y)||!validValue(m,v))return [];
      if((key==='proj'&&y<2024)||(key==='hist'&&y>2023))return [];
      return [{c,m,s:'T',y,v,src:key,kind:key==='proj'?'Hivatalos projekció':'Modellbecslés'}];
    });
  });
}
function validYear(y){return Number.isInteger(y)&&y>=1950&&y<=2100}
function validValue(metric,value){
  if(!Number.isFinite(value)||value<0)return false;
  if(metric==='gdp'||metric==='dep')return true;
  return value<=(metric==='surv'?100:metric==='fert'?20:150);
}
function readNumber(value){
  const text=value?.trim();
  return text&&/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(text)?Number(text):NaN;
}
function validSource(value){
  try{
    const url=new URL(value);
    return /^https:\/\//i.test(value)&&url.protocol==='https:'&&!url.username&&!url.password&&value===value.trim();
  }catch{return false}
}
async function importData(file){
  try{
    if(file.size>5_000_000)throw Error('A CSV legfeljebb 5 MB lehet.');
    const rows=parseCSV((await file.text()).replace(/^\ufeff/,''));
    const headers=rows.shift()??[];
    if(headers.length!==fields.length||!fields.every(key=>headers.includes(key)))throw Error('Hibás vagy hiányzó CSV-oszlopnevek.');
    const combo=r=>[r.c,r.m,r.s,r.y].join('|');
    const existing=new Set(db.map(combo));
    let added=0, skipped=0;
    for(const row of rows){
      const {c,m,s,y:year,v:value,src,kind}=Object.fromEntries(headers.map((key,i)=>[key,row[i]]));
      const y=readNumber(year),v=readNumber(value);
      const r={c,m,s,y,v,src,kind:'Saját CSV · '+(kind??''),imported:true};
      if(row.length!==fields.length||!/^[A-Z]{3}$/.test(c)||!Object.hasOwn(metrics,m)||!Object.hasOwn(sexNames,s)||
         !validYear(y)||!validValue(m,v)||!validSource(src)||!kind?.trim()||existing.has(combo(r))){
        skipped++;
        continue;
      }
      if(!Object.hasOwn(names,c))names[c]=c;
      db.push(r);
      existing.add(combo(r));
      added++;
    }
    dataStatus.import=added+' importált, '+skipped+' kihagyott (hibás vagy ütköző) rekord.';
  }catch(error){
    dataStatus.import=error.message;
  }
  if(state.tab===9)render();
}
function render(){let tab=state.tab;$('nav').innerHTML=navs.map((n,i)=>`<button class="${i===tab?'active':''}" data-tab="${i}"><span class="muted">${String(i+1).padStart(2,'0')}</span> &nbsp;${n}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=Number(b.dataset.tab);render();window.scrollTo(0,0)});$('main').innerHTML=[timeline,anatomy,retirement,cohorts,simulator,scenario,inequality,context,companion,dataPage][tab]()+`<footer>HUMAN LIFESPAN OBSERVATORY &nbsp; / &nbsp; 2026 &nbsp; / &nbsp; Oktatási kutatási prototípus · <a href="#" id="methodLink">Források és módszertan</a></footer>`;common();document.querySelectorAll('.control label').forEach(label=>{const input=label.parentElement.querySelector('input,select');if(input)label.htmlFor=input.id});$('methodLink').onclick=e=>{e.preventDefault();state.tab=9;render();window.scrollTo(0,0)};for(const k of ['entry','birth','ret','start','end'])bind(k,v=>{let e=$(k),n=Math.round(readNumber(v));if(!Number.isFinite(n)){e.value=state[k];return;}state[k]=Math.max(Number(e.min),Math.min(Number(e.max),n));if(state.start>=state.end){if(k==='start')state.end=state.start+1;else state.start=state.end-1}render()});bind('history',v=>{state.history=v;render()});bind('rank',v=>{state.rank=v;state.rankSource=undefined;state.rankYear=undefined;render()});bind('rankSource',v=>{state.rankSource=v;state.rankYear=undefined;render()});bind('rankYear',v=>{state.rankYear=Number(v);render()});if($('base'))$('base').onchange=()=>{state.base=$('base').checked;draw()};document.querySelectorAll('[data-m]').forEach(e=>e.onchange=()=>{state.ms=e.checked?[...state.ms,e.dataset.m]:state.ms.filter(x=>x!==e.dataset.m);render()});document.querySelectorAll('[data-cohort]').forEach(e=>e.onchange=()=>{let y=Number(e.dataset.cohort);state.cohort=e.checked?[...state.cohort,y]:state.cohort.filter(x=>x!==y);render()});document.querySelectorAll('[data-sc]').forEach(e=>{e.oninput=()=>{$('o'+e.dataset.sc).textContent=fmt(Number(e.value),Number(e.step)<1?2:0)};e.onchange=()=>{state.scenario[e.dataset.sc]=Number(e.value);render()}});if($('compareRange'))$('compareRange').onclick=()=>{state.start=2018;state.end=2024;render()};if($('zoom'))$('zoom').onclick=()=>{state.start=2000;state.end=2024;render()};if($('reset'))$('reset').onclick=()=>{state.start=1950;state.end=2100;render()};if($('csv'))$('csv').onclick=()=>downloadCSV(timelineSelections().flatMap(a=>a.r));if($('exportAll'))$('exportAll').onclick=()=>downloadCSV(db);if($('wbLoad'))$('wbLoad').onclick=wbLoad;if($('unLoad'))$('unLoad').onclick=()=>owLoad('hist');if($('projLoad'))$('projLoad').onclick=()=>owLoad('proj');if($('haleLoad'))$('haleLoad').onclick=()=>owLoad('hale');if($('importFile'))$('importFile').onchange=e=>{if(e.target.files[0])importData(e.target.files[0])};if(tab===0)draw()}
$('theme').onclick=()=>{document.body.classList.toggle('dark');$('theme').textContent=document.body.classList.contains('dark')?'Világos mód':'Sötét mód'};render();
