)}" stroke-width="${a.sx==='F'&&state.s==='T'?2:0}"><title>${names[a.c]} · ${metrics[a.m]} · ${a.sx==='M'?'férfi':a.sx==='F'?'nő':'összesen'} · ${p.y}: ${fmt(p.v)}</title></circle>`}}if(!values.length)out+=`<text x="495" y="200" text-anchor="middle" fill="var(--muted)" font-size="16">A kiválasztott metszetben nincs adat.</text>`;out+=`<line id="cross" x1="0" x2="0" y1="${y0}" y2="${y1}" stroke="var(--muted)" visibility="hidden"/>`;svg.innerHTML=out;svg.onpointermove=e=>{let box=svg.getBoundingClientRect(),px=(e.clientX-box.left)/box.width*960,yr=Math.round(state.start+(px-x0)/(x1-x0)*(state.end-state.start));let points=all.flatMap(a=>a.r.filter(p=>p.y===yr).map(p=>({...p,c:a.c,m:a.m,sx:a.sx})));if(px<x0||px>x1||!points.length){$('tip').style.display='none';$('cross').setAttribute('visibility','hidden');return}let tip=$('tip');tip.innerHTML=`<strong>${yr}</strong><br>`+points.map(p=>`<span style="color:${color(p.c)}">${names[p.c]}</span> · ${metrics[p.m]}${p.sx==='T'?'':p.sx==='M'?' (férfi)':' (nő)'}: <b>${fmt(p.v)}</b><br>`).join('');tip.style.display='block';tip.style.left=Math.min(e.clientX-box.left+12,box.width-245)+'px';tip.style.top='35px';$('cross').setAttribute('x1',x(yr));$('cross').setAttribute('x2',x(yr));$('cross').setAttribute('visibility','visible')};svg.onpointerleave=()=>{$('tip').style.display='none';$('cross').setAttribute('visibility','hidden')};svg.onwheel=e=>{if(!e.ctrlKey)return;e.preventDefault();let span=state.end-state.start,mid=(state.end+state.start)/2,half=Math.max(2,span*(e.deltaY>0?1.1:.9)/2);state.start=Math.max(1950,Math.round(mid-half));state.end=Math.min(2100,Math.round(mid+half));render()};let drag=null;svg.onpointerdown=e=>{drag=e.clientX};svg.onpointerup=e=>{if(drag===null)return;let delta=Math.round((drag-e.clientX)/svg.getBoundingClientRect().width*(state.end-state.start));drag=null;if(Math.abs(delta)<2)return;let span=state.end-state.start;state.start=Math.max(1950,Math.min(2100-span,state.start+delta));state.end=state.start+span;render()}}
const health0={ESP:[17.9,68.6,68.6,12.8],FRA:[22.1,63.7,63.5,16.7],ITA:[11.9,73.8,72.9,7.8],SWE:[19.3,66,68.9,13.4],FIN:[28.6,56.2,58.4,21.2],AUT:[23.7,60.6,60.2,19.6],EUU:[18.6,65.5,64.8,14.1],DNK:[22.7,61.2,63.5,16.7],DEU:[20.9,62.6,62.4,16.8],NLD:[25.1,58.2,60.8,19.7],HUN:[15.6,64.3,62.3,11.4],CHE:[29.4,56.5,59.4,23]};for(const [c,r]of Object.entries(health0)){if(c!=='HUN'){add(c,'hly','F',2024,r[1],'health');add(c,'hly','M',2024,r[2],'health')}add(c,'le','F',2024,r[0]+r[1],'health');add(c,'le','M',2024,r[2]+r[3],'health')}
function timeline(){let c=state.c[0],r=latest(c,'le',state.s),at=db.find(r=>r.c===c&&r.m==='le'&&r.s==='T'&&r.y===2024&&r.src==='ksh')?.v,aut=db.find(r=>r.c==='AUT'&&r.m==='le'&&r.s==='T'&&r.y===2024&&r.src==='ksh')?.v,h=health65[c];return title('01 / Globális idővonal','Hosszabb élet. Több szabad év?','A demográfiai változás nem azonos a jó egészségben vagy nyugdíjban eltöltött idő növekedésével. Vizsgáljuk meg az országok közötti és az időbeli különbségeket.')+`<div class="metrics">${kpi(fmt(at)+' év',names[c]+' · 2024','Születéskori élettartam · összesen')}${kpi(fmt(at-aut)+' év','Eltérés Ausztriától','2024 · összesen')}${kpi(h?fmt(h[2])+' év':'—','HLY 65 éves férfiaknál','2024 · Eurostat')}${kpi(nra[c]?fmt(nra[c][0])+' év':'—','Normál nyugdíjkorhatár, férfi','2024 · OECD teljes karrier')}</div><div class="panel"><div class="sectionline"><h2>Az életidő változása</h2><span class="pill">${state.history==='ksh'?'Beépített adatok':'Betöltött adatok'}</span></div>${chips()}<div class="controls">${control('Nem',sex())}${control('Élettartam-forrás',sel('history',{ksh:'KSH / Eurostat / WDI (beépített)',wb:'Világbank (betöltés után)',hist:'ENSZ WPP / OWID (betöltés után)'},state.history))}${control('Kezdőév',`<input id="start" type="number" min="1950" max="2099" value="${state.start}">`)}${control('Záróév',`<input id="end" type="number" min="1951" max="2100" value="${state.end}">`)}<label><input type="checkbox" id="base" ${state.base?'checked':''}> Változás az első elérhető értékhez képest</label></div><div class="countries">${['le','hale','hly','nra','exit','proj'].map(m=>`<label class="chip ${state.ms.includes(m)?'on':''}" style="--c:var(--accent)"><input type="checkbox" data-m="${m}" ${state.ms.includes(m)?'checked':''}> ${metrics[m]}</label>`).join('')}</div>${chartHTML()}<div class="legend"><span>Folytonos: élettartam</span><span>Szaggatott: korhatár / egészség / projekció</span><span>Pont: önálló referenciaérték</span></div><div class="controls"><button id="zoom">2000–2024</button><button id="reset">1950–2100</button><button id="csv">Kijelölt adatok CSV</button></div>${note('A hiányzó évek nem kerülnek interpolálásra. Az OECD korhatár nem népességi átlag: az összesített nem esetén a férfi- és női érték külön pontként jelenik meg (teli / üres kör). Ctrl + görgő: nagyítás; vízszintes húzás: eltolás. A projekció külön mutató.') }<div class="source">Források: ${link('ksh','KSH / Eurostat / World Bank')}; ${link('oecd','OECD 2025')}; ${link('hly','KSH HLY')}; ${link('health','OECD/EU 2026')}. A részletes adatelérés az Adatok menüben található.</div></div>`}
function anatomy(){let s=state.s==='T'?'M':state.s;return title('02 / Életpálya','Az emberi életidő anatómiája','Az életpálya feltételes, szemléltető felbontása. A 65. életév elérését már feltételezzük.')+`<div class="panel">${chips()}<div class="controls">${control('Nem',sex(s))}${control('Munkába lépés (feltételezés)',`<input id="entry" type="number" min="15" max="40" value="${state.entry}">`)}</div><h2>65 éves korban kezdődő nyugdíj</h2><div class="legend"><span><i class="sw" style="background:var(--child)"></i>Tanulás / belépésig</span><span><i class="sw" style="background:var(--work)"></i>Munkával töltött időszak</span><span><i class="sw" style="background:var(--healthy)"></i>HLY</span><span><i class="sw" style="background:var(--limited)"></i>Egészségi korlátozottság</span></div>${lifetimeRows(state.c,s,state.entry,65)}${note('Ez nem egy tipikus újszülött várható életpályája: a 65 éves korig tartó szakasz hipotetikus, a hátralévő szakasz 2024-es periódusmutató. A HLY és a korlátozott évek nem feltétlenül egymást követő életszakaszok. Csak európai országokra van itt beépített HLY65. A csík teljes hossza 100 év.') }<div class="source">${link('health','OECD/Európai Bizottság 2026, 3.4. ábra (Eurostat)')}</div></div>`}
function retirement(){let s=state.s==='T'?'M':state.s;let rows=state.c.map(c=>{let d=health65[c],h=d?(s==='M'?d[2]:d[1]):null,l=d?(s==='M'?d[3]:d[0]):null;return `<tr><td style="color:${color(c)}">${names[c]}</td><td>${fmt(nra[c]?.[s==='M'?0:1])}</td><td>${fmt(h!=null?h+l:NaN)}</td><td>${fmt(h)}</td><td>${fmt(l)}</td><td>${h!=null?fmt(100*h/(h+l),0)+'%':'—'}</td></tr>`}).join('');return title('03 / Nyugdíjlehetőség','A nyugdíjban megnyíló évek','A releváns kérdés: hány egészséges év várható attól a kortól, amikor ténylegesen nyugdíjba vonulhatunk?')+`<div class="panel">${chips()}${control('Nem',sex(s))}<h2>Összehasonlítás 2024-ben</h2><div class="tablewrap"><table><thead><tr><th>Ország</th><th>Normál korhatár</th><th>e(65)</th><th>HLY(65)</th><th>Korlátozott évek (65)</th><th>HLY arány</th></tr></thead><tbody>${rows}</tbody></table></div>${note('A 65 éves korban mért értékek nem az eltérő nyugdíjkorhatárokra számított nyugdíjhosszak. Csak pontosan 65 éves nyugdíjba lépésnél értelmezhetők így. Az OECD korhatár a 22 évesen kezdett megszakítás nélküli karrier modellje. A tényleges kilépés idősora nincs beépítve.') }<div class="source">${link('oecd','OECD, 3.5. tábla')}; ${link('health','Eurostat, 2024 / OECD-EU 2026')}; ${link('exit','Tényleges kilépési életkor, OECD')}</div></div>`}
function cohorts(){let r=state.ret;return title('04 / Generációk','Eltérő korszakok, eltérő életpályák','A kohorszok jövőjét nem lehet a születésük évében mért periódus-élettartammal előre jelezni.')+`<div class="panel"><div class="controls">${control('Ország',sel('focus',names,state.focus))}${control('Szemléltető nyugdíjkor',`<input type="number" min="55" max="75" id="ret" value="${r}">`)}</div><div class="countries">${[1930,1940,1950,1960,1970,1980,1990,2000,2010,2020].map(y=>`<label class="chip ${state.cohort.includes(y)?'on':''}" style="--c:var(--accent)"><input type="checkbox" data-cohort="${y}" ${state.cohort.includes(y)?'checked':''}>${y}</label>`).join('')}</div><div class="tablewrap"><table><tr><th>Születési év</th><th>Életkor 2026-ban*</th><th>Belépés éve (22 év)</th><th>Nyugdíj éve (${r} év)</th><th>Születéskori periódusmutató</th></tr>${state.cohort.sort((a,b)=>a-b).map(y=>`<tr><td>${y}</td><td>${2026-y}</td><td>${y+22}</td><td>${y+r} ${y+r>2026?'· jövő':''}</td><td>${fmt(val(state.focus,'le','T',y))}</td></tr>`).join('')}</table></div>${note('* Az év során betöltött életkor. A nyugdíj éve egy választott forgatókönyv, nem tényleges jogi jogosultság. A teljes kohorszhalandósági adatok és a jövőbeli kohorszelőrejelzések hiányoznak.')}</div>`}
function simulator(){let s=state.s==='F'?'F':'M',c=state.focus,d=health65[c],h=d?(s==='M'?d[2]:d[1]):null,l=d?(s==='M'?d[3]:d[0]):null;let age=2026-state.birth,r=state.ret,e=state.entry;return title('05 / Egyéni labor','Mennyi idő állhat előttünk?','Személyre szabható oktatási modell, nem egyéni egészségügyi vagy pénzügyi előrejelzés.')+`<div class="panel"><div class="controls">${control('Ország',sel('focus',names,state.focus))}${control('Nem',sex(s))}${control('Születési év',`<input type="number" id="birth" min="1930" max="2026" value="${state.birth}">`)}${control('Munkába lépés',`<input type="number" id="entry" min="15" max="40" value="${e}">`)}${control('Tervezett nyugdíjkor',`<input type="number" id="ret" min="50" max="80" value="${r}">`)}</div><div class="metrics">${kpi(age+' év','Év során betöltött életkor')}${kpi(state.birth+r,'Tervezett nyugdíjazás éve')}${kpi(r-e+' év','Elméleti munkaszakasz','Megszakítás nélkül')}${kpi(r===65&&h!=null?fmt(h+l)+' év':'—','Feltételes hátralévő idő','2024-es periódus, csak 65 évesen')}${kpi(r===65&&h!=null?fmt(h)+' év':'—','Korlátozottság nélküli évek','Nem személyes prognózis')}</div>${lifetimeRows([c],s,e,r)}${note('Az eltérő nyugdíjkorokhoz és a jelenlegi életkorhoz szükséges életkor-specifikus halandósági tábla nincs beépítve. Túlélési valószínűség és bizonytalansági sáv ezért nem számítható ki. 65 évnél a 2024-es időszaki mutató jelenik meg, nem a jövőbeni nyugdíjév prognózisa.')}</div>`}
function scenario(){let a=state.scenario,d=health65[state.focus],s=state.s==='F'?'F':'M',h=d?(s==='M'?d[2]:d[1]):null,l=d?(s==='M'?d[3]:d[0]):null;let participants=(a.workers+a.migration)*a.particip/100,ratio=participants>0?a.dep/participants:NaN,tax=ratio*a.replace,prod=Math.pow(1+a.prod/100,24);let sliders=[['ret','Nyugdíjkor (év)',55,75,1],['lon','65 éves kori élettartam-változás (év)',-2,8,.5],['healthy','HLY65-változás (év)',-2,8,.5],['dep','65+ népesség (100 kiinduló munkaképesre)',10,90,1],['particip','Foglalkoztatási arány (%)',40,95,1],['prod','Éves reáltermelékenység-növekedés (%)',0,5,.25],['replace','Nyugdíj / átlagbér (%)',20,90,1],['workers','Munkaképes népesség (index)',60,140,1],['migration','Nettó munkaképes migráció (indexpont)',-20,30,1]];let valid=h!=null&&h+a.healthy>=0&&h+l+a.lon>=h+a.healthy;return title('06 / Jövőlabor','A nyugdíjrendszer 2050-ben','Hipotetikus, statikus érzékenységvizsgálat: milyen irányba mozdulnak a mutatók a megadott feltételek mellett?')+`<div class="panel"><div class="controls">${control('Ország',sel('focus',names,state.focus))}${control('Nem',sex(s))}</div><div class="sliders">${sliders.map(([k,n,min,max,step])=>`<div><label class="label">${n}</label><div class="sectionline"><output id="o${k}">${fmt(a[k],step===.25?2:step===.5?1:0)}</output></div><input type="range" data-sc="${k}" min="${min}" max="${max}" step="${step}" value="${a[k]}"></div>`).join('')}</div><div class="metrics" id="sout">${kpi(fmt(ratio*100,0),'Idős személy / 100 foglalkoztatott','Hipotetikus arány')}${kpi(fmt(tax,1)+'%','Elméleti bérarányos teher','Egyszerű felosztó-kirovó azonosság')}${kpi(fmt(prod,2)+'×','Termelékenységi szorzó','2026 → 2050')}${kpi(valid&&a.ret===65?fmt(h+l+a.lon)+' év':'—','Hipotetikus e(65)','Csak 65 éves nyugdíjkor esetén')}${kpi(valid&&a.ret===65?fmt(h+a.healthy)+' év':'—','Hipotetikus HLY(65)')}</div>${note('Teher = (65+ létszám / foglalkoztatottak) × helyettesítési ráta; feltételezi, hogy minden 65+ személy nyugdíjas. A korhatár változtatása nem módosít automatikusan népességszámokat. A termelékenységi szorzó külön jelenik meg, nem csökkenti mechanikusan a járulékrátát. Termékenység hatásához korstruktúra-modell szükséges, ezért nem szerepel aktív csúszkaként. Ez nem fenntarthatósági előrejelzés.')}</div>`}
function inequality(){let s=state.s, m=state.rank;let rows=Object.keys(names).map(c=>({c,r:latest(c,m,s)})).filter(x=>x.r).sort((a,b)=>b.r.v-a.r.v);let max=Math.max(...rows.map(x=>x.r.v),1);return title('07 / Egyenlőtlenségek','A hosszú élet földrajza','Egyetlen, világosan definiált mutató szerinti összehasonlítás – mesterséges összesített pontszám nélkül.')+`<div class="panel"><div class="controls">${control('Mutató',sel('rank',metrics,m))}${control('Nem',sex())}</div><h2>Rangsor · elérhető legfrissebb adatok</h2>${rows.map(({c,r})=>`<div class="barrow"><span>${names[c]} <small class="muted">${r.y}</small></span><div class="bartrack"><span style="background:${color(c)};width:${r.v/max*100}%"></span></div><b>${fmt(r.v)}</b></div>`).join('')||'<p>Nincs adat ebben a metszetben.</p>'}${note('A legfrissebb referenciaév országonként eltérhet. Nem rangsorolható országok: '+Object.keys(names).filter(c=>!rows.some(x=>x.c===c)).map(c=>names[c]).join(', ')+'. A földrajzi térkép ebben a kiadásban nem készült el.')}</div>`}
function context(){return title('08 / Történeti háttér','Az évszámok mögött','A trendek értelmezéséhez a történelmi és intézményi összefüggések ismerete szükséges.')+`<div class="panel">${[['1950–','Demográfiai átmenet','A csecsemő- és gyermekkori halandóság csökkenése növelheti a születéskori várható élettartamot anélkül, hogy ugyanennyivel nőne a nyugdíjas korúak hátralévő élete.'],['1989–1990','Közép-európai rendszerváltás','A munkapiaci és intézményi változások lehetséges szerepe vizsgálandó; az együttjárás önmagában nem oksági bizonyíték.'],['2008–2009','Pénzügyi válság','A munkaerőpiaci helyzet, költségvetési nyomás és reformok összefüggése külön elemzést igényel.'],['2020–2021','COVID–19','Az időszaki élettartam több országban visszaesett. Nem minden változás vezethető vissza kizárólag a vírus közvetlen hatására.'],['2024–','Nyugdíjrendszer-reformok','Az OECD által számított normál korhatár és a jövőbeli jogosultsági feltételek változása nem azonos a tényleges munkapiaci kilépéssel.']].map(([y,t,d])=>`<div class="question"><span class="eyebrow">${y}</span><h3>${t}</h3><p>${d}</p></div>`).join('')}<div class="source">${link('euro','Eurostat – halandóság')}; ${link('wpp','ENSZ WPP')}; ${link('oecd','OECD – nyugdíjkorhatár')}</div></div>`}
function companion(){let c=state.c[0],x=val(c,'le','T',2024),a=val('AUT','le','T',2024);return title('09 / Kutatási kalauz','Kérdezzünk pontosabban','Forrásalapú, beépített értelmezési segédlet. Nem élő generatív AI.')+`<div class="panel"><div class="controls">${control('Vizsgált ország',sel('focus',names,state.focus))}</div>${[['Mit mond a születéskori élettartam?',`A kiválasztott ország (${names[state.focus]}) beépített 2024-es értéke ${fmt(val(state.focus,'le','T',2024))} év. Ez egy hipotetikus periódusmutató, nem az adott évben született gyermek tényleges várható élettartamának előrejelzése. ${link('ksh','Adatforrás')}.`],['Miért rövidebb a magyar élettartam az osztráknál?',`A 2024-es összehasonlítható születéskori érték 76,8 és 82,1 év. A különbség értelmezéséhez a halálokok, az életkörülmények, a kockázati tényezők és az ellátáshoz való hozzáférés vizsgálata szükséges. Az OECD európai egészségjelentése a magyar magas kardiovaszkuláris halandóságot kiemeli. ${link('health','OECD/EU jelentés')} · ${link('ksh','KSH')}.`],['Mi a HALE és a HLY különbsége?',`A WHO HALE a különböző egészségi állapotokat súlyozza. Az Eurostat HLY az aktivitáskorlátozottság nélküli éveket méri. Eltérő mérési konstrukciók, közvetlenül nem helyettesíthetők. ${link('hale','WHO/OWID HALE')} · ${link('health','Eurostat HLY')}.`],['A nők több egészséges évet nyernek?',`Az EU-ban 2024-ben 65 éves kortól a nők 21,8, a férfiak 18,4 további évre számíthattak. HLY: 10,5 és 10,0 év. A hosszabb össz-élettartam tehát nem feltétlenül jelent arányosan több korlátozottság nélküli időt. ${link('health','Forrás: 3.4. ábra')}.`],['Miért nem azonos a nyugdíj és a munkapiaci kilépés?',`A nyugdíjjogosultság intézményi szabály, a kilépés munkaerőpiaci statisztika. A nyugdíj mellett is lehet dolgozni, és a munkából a jogosultság előtt is ki lehet lépni. ${link('exit','OECD módszertan')}.`],['Mit jelent a társadalmi egyenlőtlenség?',`A foglalkozás, iskolázottság, jövedelem, gondozási terhek és lakóhely befolyásolhatják az életpályát. A nem fizetett gondozási munka és társadalmi részvétel külön indikátorokat kíván; országátlagból nem állapítható meg az egyéni helyzet. ${link('health','OECD/EU – egészségi egyenlőtlenségek')}.`],['Ellensúlyozhatja-e a termelékenység a népesség öregedését?',`Növelheti az egy dolgozóra jutó kibocsátást, de a nyugdíjak bérindexálása, az adóalap és a foglalkoztatási arány meghatározza a költségvetési következményeket. A Jövőlabor csak egyszerű azonosságot szemléltet.`]].map(([q,a])=>`<details class="question"><summary>${q}</summary><p>${a}</p></details>`).join('')}</div>`}
const wbCodes={le:{T:'SP.DYN.LE00.IN',M:'SP.DYN.LE00.MA.IN',F:'SP.DYN.LE00.FE.IN'},fert:{T:'SP.DYN.TFRT.IN'},dep:{T:'SP.POP.DPND.OL'},gdp:{T:'NY.GDP.PCAP.KD'},surv:{M:'SP.DYN.TO65.MA.ZS',F:'SP.DYN.TO65.FE.ZS'}};
const owid={hist:{m:'le',slug:'life-expectancy-unwpp'},proj:{m:'proj',slug:'future-life-expectancy-projections'},hale:{m:'hale',slug:'healthy-life-expectancy-at-birth'}};
function dataPage(){return title('10 / Adatregiszter','Módszertan és adatlefedettség','A forrásverzió, az indikátor definíciója és az adathiány az eredmény része.')+`<div class="panel"><h2>Adatok frissítése és bővítése</h2><p>Az alkalmazás beépített adatokat tartalmaz, és internetkapcsolat esetén közvetlenül megpróbálja betölteni a nyilvános adatforrásokat. Az API-k és a böngésző hozzáférési szabályai változhatnak. Sikertelen betöltés nem módosítja a meglévő adatokat.</p><div class="controls"><button class="primary" id="wbLoad">Világbank idősorok (1960–)</button><button id="unLoad">ENSZ / OWID élettartam (1950–)</button><button id="projLoad">ENSZ projekció (2024–2100)</button><button id="haleLoad">WHO HALE (OWID)</button></div><div id="loadStatus" class="status" aria-live="polite"></div><p class="muted">A külső adatok csak az aktuális munkamenetben maradnak meg. A teljes adatállomány CSV-ben exportálható.</p><button id="exportAll">Minden betöltött adat exportálása</button><h3>Saját adatok importálása</h3><p class="muted">CSV oszlopai: c,m,s,y,v,src,kind. ISO3 országkód, mutatókód, T/M/F nem, év, szám, forrás HTTPS URL, adatállapot. A meglevő rekordok nem íródnak felül. Új országkód importálható.</p><input type="file" accept=".csv,text/csv" id="importFile"><div id="importStatus" class="status"></div><details><summary>Mutatókódok</summary><p>${Object.entries(metrics).map(([k,v])=>`<code>${k}</code> = ${v}`).join(' · ')}</p></details></div><div class="panel"><h2>Forrásregiszter</h2><div class="tablewrap"><table><thead><tr><th>Adat / forrás</th><th>Referenciaidő</th><th>Mérték</th><th>Korlát / verzió</th></tr></thead><tbody><tr><td>${link('ksh','KSH STADAT 22.1.3.9')}</td><td>2000–2024</td><td>Év</td><td>2026.07.14-i lekérés; Eurostat / WDI; becsült értékek is.</td></tr><tr><td>${link('oecd','OECD Pensions at a Glance 2025')}</td><td>2024</td><td>Életkor</td><td>22 évesen kezdett teljes karrier; szabálymodell.</td></tr><tr><td>${link('health','OECD/EU 2026, 3.3–3.4. ábra')}</td><td>2024</td><td>Év</td><td>Eurostat HLY; önbevallott korlátozottság, módszertani eltérések; e(65) kerekített összeg.</td></tr><tr><td>${link('hly','KSH STADAT 4.1.1.44')}</td><td>2006–2025</td><td>Év</td><td>Sullivan 2015-től; 2019 kérdezési változás.</td></tr><tr><td>${link('wb','Világbank WDI')}</td><td>API szerint</td><td>Év, %, USD</td><td>Csak betöltés után; felülvizsgálható.</td></tr><tr><td>${link('hist','ENSZ WPP 2024 / OWID')}</td><td>1950–2023</td><td>Év</td><td>Periódusbecslések; csak betöltés után.</td></tr><tr><td>${link('proj','ENSZ WPP 2024 / OWID')}</td><td>2024–2100</td><td>Év</td><td>Hivatalos projekció; nem megfigyelt adat; csak betöltés után.</td></tr><tr><td>${link('hale','WHO GHO / OWID')}</td><td>Forrás szerint</td><td>Év</td><td>Modellbecslés; nem HLY; csak betöltés után.</td></tr></tbody></table></div><h3>Aktuális lefedettség</h3><div class="tablewrap"><table><tr><th>Mutató</th><th>Ország/régió</th><th>Első év</th><th>Utolsó év</th><th>Rekord</th></tr>${Object.entries(metrics).map(([m,n])=>{let rs=db.filter(r=>r.m===m);return `<tr><td>${n}</td><td>${new Set(rs.map(r=>r.c)).size}</td><td>${rs.length?Math.min(...rs.map(r=>r.y)):'—'}</td><td>${rs.length?Math.max(...rs.map(r=>r.y)):'—'}</td><td>${rs.length}</td></tr>`}).join('')}</table></div>${note('Nem beépített: teljes történelmi nyugdíjkorhatár és kilépési kor, életkor-specifikus teljes élettábla, kohorszhalandóság, helyettesítési ráták országadatai, egyéni bizonytalanság, jövedelmi és oktatási bontás, térkép. Az export megőrzi az adatállapotot és forrásazonosítót. A források eredeti revíziós jelzései nem minden rekordra érhetők el.')}</div>`}
function parseCSV(t){let rows=[],row=[],v='',q=false;for(let i=0;i<t.length;i++){let ch=t[i];if(ch==='"'){if(q&&t[i+1]==='"'){v+='"';i++}else q=!q}else if(ch===','&&!q){row.push(v);v=''}else if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(v);if(row.some(Boolean))rows.push(row);row=[];v=''}else v+=ch}if(v||row.length){row.push(v);rows.push(row)}return rows}
function downloadCSV(rows){let q=v=>'"'+String(v??'').replaceAll('"','""')+'"',txt='c,m,s,y,v,src,kind\n'+rows.map(r=>[r.c,r.m,r.s,r.y,r.v,source[r.src]||r.src,r.kind].map(q).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type:'text/csv;charset=utf-8'}));a.download='human-lifespan-adatok.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function wbLoad(){let st=$('loadStatus');st.textContent='Világbank lekérdezése…';let before=db.length,fail=[];for(const [m,ss]of Object.entries(wbCodes))for(const [s,code]of Object.entries(ss)){try{let u=`https://api.worldbank.org/v2/country/${Object.keys(names).join(';')}/indicator/${code}?format=json&date=1960:2026&per_page=20000`;let res=await fetch(u);if(!res.ok)throw Error('HTTP '+res.status);let j=await res.json();if(!Array.isArray(j[1]))throw Error('Nincs adat');for(let r of j[1]){if(r.value!==null&&names[r.countryiso3code]&&!db.some(x=>x.c===r.countryiso3code&&x.m===m&&x.s===s&&x.y===Number(r.date)&&x.src==='wb'))add(r.countryiso3code,m,s,Number(r.date),Number(r.value),'wb','WDI közölt / becsült')}st.textContent=`${db.length-before} új rekord; ${code} feldolgozva.`}catch(e){fail.push(code)}}if(db.length>before)state.history='wb';render();$('loadStatus').textContent=`${db.length-before} új rekord. ${fail.length?'Sikertelen: '+fail.join(', ')+'. Ellenőrizd az internetkapcsolatot vagy importálj CSV-t.':'Betöltés befejezve.'}`}
async function owLoad(key){let st=$('loadStatus'),o=owid[key];st.textContent='Lekérés…';try{let res=await fetch(`https://ourworldindata.org/grapher/${o.slug}.csv?csvType=full`);if(!res.ok)throw Error('HTTP '+res.status);let rows=parseCSV(await res.text()),headers=rows.shift();let ci=headers.indexOf('Code'),yi=headers.indexOf('Year');if(ci<0||yi<0)throw Error('Ismeretlen CSV séma');let cols=headers.map((h,i)=>({h,i})).filter(x=>!['Entity','Code','Year'].includes(x.h));let chosen=cols.length===1?cols[0]:cols.find(x=>/birth/i.test(x.h)&&/both sexes|total|medium/i.test(x.h)&&!/female|male|upper|lower/i.test(x.h));if(!chosen)throw Error('Több adatmező, nem egyértelmű definíció; kézi import szükséges: '+cols.map(x=>x.h).join(', '));let n=0;for(let row of rows){let c=({OWID_WRL:'WLD',OWID_EU27:'EUU',OWID_OECD:'OED'})[row[ci]]||row[ci],y=Number(row[yi]),v=row[chosen.i];if(!names[c]||!v||!Number.isFinite(Number(v))||y<1950||y>2100||key==='proj'&&y<2024||key==='hist'&&y>2023)continue;if(!db.some(x=>x.c===c&&x.m===o.m&&x.s==='T'&&x.y===y&&x.src===key)){add(c,o.m,'T',y,Number(v),key,key==='proj'?'Hivatalos projekció':'Modellbecslés');n++}}if(key==='hist'&&n)state.history='hist';if(key==='proj'&&n&&!state.ms.includes('proj'))state.ms.push('proj');render();$('loadStatus').textContent=`${n} új rekord. Felhasznált oszlop: ${chosen.h}.`}catch(e){st.textContent='Nem sikerült betölteni: '+e.message+'. A beépített adatok változatlanok.'}}
async function importData(file){try{let rows=parseCSV((await file.text()).replace(/^\ufeff/,'')),hdr=rows.shift(),keys=['c','m','s','y','v','src','kind'];if(!keys.every(k=>hdr.includes(k)))throw Error('Hibás oszlopnevek.');let n=0,bad=0;for(let row of rows){let r=Object.fromEntries(keys.map(k=>[k,row[hdr.indexOf(k)]]));let y=Number(r.y),v=Number(r.v);if(!/^[A-Z]{3}$/.test(r.c)||!metrics[r.m]||!['T','M','F'].includes(r.s)||!Number.isInteger(y)||y<1900||y>2100||!r.v||!Number.isFinite(v)||!/^https:\/\//.test(r.src)||!r.kind){bad++;continue}if(db.some(x=>x.c===r.c&&x.m===r.m&&x.s===r.s&&x.y===y)){bad++;continue}if(!names[r.c])names[r.c]=r.c;add(r.c,r.m,r.s,y,v,r.src,r.kind);n++}render();$('importStatus').textContent=`${n} importált, ${bad} kihagyott (hibás vagy ütköző) rekord.`}catch(e){$('importStatus').textContent=e.message}}
function render(){let tab=state.tab;$('nav').innerHTML=navs.map((n,i)=>`<button class="${i===tab?'active':''}" data-tab="${i}"><span class="muted">${String(i+1).padStart(2,'0')}</span> &nbsp;${n}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=Number(b.dataset.tab);render();window.scrollTo(0,0)});$('main').innerHTML=[timeline,anatomy,retirement,cohorts,simulator,scenario,inequality,context,companion,dataPage][tab]()+`<footer>HUMAN LIFESPAN OBSERVATORY &nbsp; / &nbsp; 2026 &nbsp; / &nbsp; Oktatási kutatási prototípus · <a href="#" id="methodLink">Források és módszertan</a></footer>`;common();$('methodLink').onclick=e=>{e.preventDefault();state.tab=9;render();window.scrollTo(0,0)};for(const k of ['entry','birth','ret','start','end'])bind(k,v=>{let e=$(k),n=Math.round(Number(v));if(!Number.isFinite(n))return;state[k]=Math.max(Number(e.min),Math.min(Number(e.max),n));if(state.start>=state.end){if(k==='start')state.end=state.start+1;else state.start=state.end-1}render()});bind('history',v=>{state.history=v;render()});bind('rank',v=>{state.rank=v;render()});if($('base'))$('base').onchange=()=>{state.base=$('base').checked;draw()};document.querySelectorAll('[data-m]').forEach(e=>e.onchange=()=>{state.ms=e.checked?[...state.ms,e.dataset.m]:state.ms.filter(x=>x!==e.dataset.m);render()});document.querySelectorAll('[data-cohort]').forEach(e=>e.onchange=()=>{let y=Number(e.dataset.cohort);state.cohort=e.checked?[...state.cohort,y]:state.cohort.filter(x=>x!==y);render()});document.querySelectorAll('[data-sc]').forEach(e=>{e.oninput=()=>{$('o'+e.dataset.sc).textContent=fmt(Number(e.value),Number(e.step)<1?2:0)};e.onchange=()=>{state.scenario[e.dataset.sc]=Number(e.value);render()}});if($('zoom'))$('zoom').onclick=()=>{state.start=2000;state.end=2024;render()};if($('reset'))$('reset').onclick=()=>{state.start=1950;state.end=2100;render()};if($('csv'))$('csv').onclick=()=>downloadCSV(state.c.flatMap(c=>state.ms.flatMap(m=>(state.s==='T'&&['nra','exit'].includes(m)?['M','F']:[state.s]).flatMap(sx=>series(c,m,sx).filter(r=>r.y>=state.start&&r.y<=state.end)))));if($('exportAll'))$('exportAll').onclick=()=>downloadCSV(db);if($('wbLoad'))$('wbLoad').onclick=wbLoad;if($('unLoad'))$('unLoad').onclick=()=>owLoad('hist');if($('projLoad'))$('projLoad').onclick=()=>owLoad('proj');if($('haleLoad'))$('haleLoad').onclick=()=>owLoad('hale');if($('importFile'))$('importFile').onchange=e=>{if(e.target.files[0])importData(e.target.files[0])};if(tab===0)draw()}
$('theme').onclick=()=>{document.body.classList.toggle('dark');$('theme').textContent=document.body.classList.contains('dark')?'Világos mód':'Sötét mód'};render();
